<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A little puzzle for you</title>
<style>
  :root{--bg:#1d1b2e;--ink:#fbf3e8;--accent:#ff8fa3;--tile:#2b2842;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;
    display:flex;justify-content:center;padding:24px 16px;line-height:1.5}
  main{width:100%;max-width:420px;text-align:center;position:relative;z-index:1}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  h1{font-size:1.7rem;font-weight:normal;margin:8px 0 6px}
  p{margin:0 0 16px;opacity:.85}
  #board{position:relative;width:100%;aspect-ratio:1;background:var(--tile);border-radius:10px;overflow:hidden;touch-action:manipulation}
  .tile{position:absolute;width:33.3333%;height:33.3333%;background-size:300% 300%;background-color:var(--tile);
    border:2px solid var(--bg);cursor:pointer;transition:left .18s ease,top .18s ease;
    display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff8;}
  .tile:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
  #board.done .tile{border-color:transparent;cursor:default}
  #moves{margin:12px 0;font-size:.95rem;opacity:.7}
  button.btn{background:var(--accent);color:#2a1020;border:0;border-radius:999px;padding:12px 26px;font:inherit;font-size:1.05rem;cursor:pointer;text-decoration:none;display:inline-block}
  button.btn:focus-visible,a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  a.btn{background:var(--accent);color:#2a1020;border-radius:999px;padding:12px 26px;text-decoration:none;display:inline-block;font-size:1.05rem}
  .stage{display:none}
  .stage.show{display:block;animation:rise .8s ease both}
  .letter{font-size:1.25rem;font-style:italic;margin:24px 0;white-space:pre-line}
  #ticket{width:100%;border-radius:10px;margin:16px 0}
  .ghost{background:none;border:1px solid #fff4;color:var(--ink);border-radius:999px;padding:6px 16px;font:inherit;font-size:.9rem;cursor:pointer;margin-top:8px}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.tile{transition:none}.stage.show{animation:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <section id="puzzle">
    <h1 id="title"></h1>
    <p id="intro"></p>
    <div id="board" role="group" aria-label="Sliding puzzle"></div>
    <div id="moves">Moves: 0</div>
    <button class="ghost" id="reshuffle">Shuffle again</button>
  </section>

  <section id="message" class="stage">
    <h1 id="doneTitle"></h1>
    <div class="letter" id="letter"></div>
    <button class="btn" id="next"></button>
  </section>

  <section id="reveal" class="stage">
    <h1 id="revealTitle"></h1>
    <img id="ticket" alt="Flight details" hidden>
    <p id="details"></p>
    <a class="btn" id="link" target="_blank" rel="noopener" hidden>See the reservation</a>
  </section>
</main>

<script>
/* ============ EDIT THIS PART ============ */
const CONFIG = {
  photo: "photo.jpeg",          // the picture of you two (square-ish works best), same folder as this file
  ticketImage: "ticket.jpg",   // picture of the flight/ticket (optional: delete the file and set to "")
  reservationLink: "https://www.wizzair.com/en-gb/itinerary/LT9BNX/Macedo%20Ferreira?utm_source=wizz&utm_medium=web&utm_campaign=shared_trip",         // optional link to the reservation, e.g. "https://..."
  title: "PARABÉNS GOSTOSONAAAAAA!",
  intro: "Completa isto se queres a tua prenda :).",
  doneTitle: "uau conseguiste",
  letter: "Laura dias Ferreira estou a escrever isto às 6 e meia ou seja umas 5 horas antes de veres isto. Espero que saibas que estive a fazer este site de  merda no forum durante muito tempo por isso espero que saibas que saber faz bem. Espero que gostes da PRENDJINHAAA. Eu era para te dar outra coisa mas acho esta muito mais memorável e esta está a contribuir para a prenda que te vou dar quando fizermos 1 ano de namoro :D (não sei se posso meter emojis) TXI AMO POCKET PUSSY GOSTOSO RAHHH",
  nextButton: "le proxim",
  revealTitle: "BUDAPESTINGS OMGFGFGFGFGF!!!!!!11!!!!!",
  details: "Prepara a galeria e a buceta"
};
/* ======================================== */

const N = 3, board = document.getElementById("board");
let order, empty, moves, solved;
const $ = id => document.getElementById(id);

$("title").textContent = CONFIG.title;
$("intro").textContent = CONFIG.intro;
$("doneTitle").textContent = CONFIG.doneTitle;
$("letter").textContent = CONFIG.letter;
$("next").textContent = CONFIG.nextButton;
$("revealTitle").textContent = CONFIG.revealTitle;
$("details").textContent = CONFIG.details;
if (CONFIG.reservationLink){ $("link").href = CONFIG.reservationLink; $("link").hidden = false; }
if (CONFIG.ticketImage){ const t=$("ticket"); t.onload=()=>t.hidden=false; t.src=CONFIG.ticketImage; }

// order[pos] = tile id currently at grid position pos; empty tile is id N*N-1
function build(){
  board.innerHTML = ""; board.classList.remove("done");
  for (let id=0; id<N*N-1; id++){
    const t = document.createElement("div");
    t.className = "tile"; t.tabIndex = 0; t.dataset.id = id;
    t.setAttribute("role","button"); t.setAttribute("aria-label","Piece "+(id+1));
    t.style.backgroundImage = `url("${CONFIG.photo}")`;
    t.style.backgroundPosition = `${(id%N)*100/(N-1)}% ${Math.floor(id/N)*100/(N-1)}%`;
    t.textContent = ""; // numbers show only if the photo fails to load
    t.onclick = () => tryMove(order.indexOf(id));
    t.onkeydown = e => { if (e.key==="Enter"||e.key===" "){e.preventDefault();tryMove(order.indexOf(id));} };
    board.appendChild(t);
  }
}
function place(){
  board.querySelectorAll(".tile").forEach(t=>{
    const p = order.indexOf(+t.dataset.id);
    t.style.left = (p%N)*100/N + "%"; t.style.top = Math.floor(p/N)*100/N + "%";
  });
  $("moves").textContent = "Moves: " + moves;
}
function neighbors(p){
  const r=Math.floor(p/N), c=p%N, n=[];
  if(r>0)n.push(p-N); if(r<N-1)n.push(p+N); if(c>0)n.push(p-1); if(c<N-1)n.push(p+1);
  return n;
}
function swap(p){ [order[p],order[empty]]=[order[empty],order[p]]; empty=p; }
function tryMove(p){
  if (solved || !neighbors(p).includes(empty)) return;
  swap(p); moves++; place();
  if (order.every((id,i)=>id===i || id===N*N-1 && i===N*N-1)) win();
}
function shuffle(){
  solved=false; moves=0; order=[...Array(N*N).keys()]; empty=N*N-1;
  let prev=-1;
  for(let i=0;i<200;i++){ // random legal moves => always solvable
    const opts = neighbors(empty).filter(x=>x!==prev);
    const p = opts[Math.floor(Math.random()*opts.length)];
    prev = empty; swap(p);
  }
  if (order.every((id,i)=>id===i)) return shuffle();
  build(); place();
}
function win(){
  solved=true; board.classList.add("done");
  // fill in the last piece
  const last = document.createElement("div");
  last.className="tile"; last.style.left="66.6667%"; last.style.top="66.6667%";
  last.style.backgroundImage=`url("${CONFIG.photo}")`; last.style.backgroundPosition="100% 100%";
  board.appendChild(last);
  $("reshuffle").hidden = true;
  celebrate();
  setTimeout(()=>{ $("message").classList.add("show"); $("message").scrollIntoView({behavior:"smooth"}); }, 900);
}
/* ---------- Hearts + fireworks ---------- */
const cv = $("fx"), cx = cv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
let W, H;
function size(){
  const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W*d; cv.height = H*d; cx.setTransform(d,0,0,d,0,0);
}
addEventListener("resize", size); size();

function heart(x, y, s){
  cx.beginPath();
  cx.moveTo(x, y + s*.3);
  cx.bezierCurveTo(x, y - s*.3, x - s, y - s*.3, x - s, y + s*.3);
  cx.bezierCurveTo(x - s, y + s*.8, x, y + s, x, y + s*1.3);
  cx.bezierCurveTo(x, y + s, x + s, y + s*.8, x + s, y + s*.3);
  cx.bezierCurveTo(x + s, y - s*.3, x, y - s*.3, x, y + s*.3);
  cx.fill();
}
const rnd = (a, b) => a + Math.random()*(b - a);
const floaters = Array.from({length: 30}, () => ({
  x: rnd(0, W), y: rnd(0, H), s: rnd(6, 16), v: reduce ? 0 : rnd(.15, .5),
  ph: rnd(0, 6.28), a: rnd(.08, .25)
}));
const sparks = [];
function burst(x, y){
  const hue = rnd(330, 360), n = 70;
  for (let i = 0; i < n; i++){
    const ang = (i/n)*6.283 + rnd(-.1, .1), sp = rnd(1.5, 5.5);
    sparks.push({x, y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, life: 1,
      decay: rnd(.008, .018), r: rnd(1.5, 3), heart: Math.random() < .25,
      c: `hsl(${Math.random() < .3 ? rnd(35, 50) : hue}, 100%, ${rnd(65, 80)}%)`});
  }
}
function celebrate(){
  if (reduce) return;
  let n = 0;
  const go = () => { burst(rnd(W*.15, W*.85), rnd(H*.12, H*.5)); if (++n >= 12) clearInterval(t); };
  const t = setInterval(go, 380); go();
}
let tick = 0;
(function frame(){
  cx.clearRect(0, 0, W, H); tick += .01;
  cx.fillStyle = "#ff8fa3";
  for (const f of floaters){
    f.y -= f.v; if (f.y < -30) { f.y = H + 30; f.x = rnd(0, W); }
    cx.globalAlpha = f.a; heart(f.x + Math.sin(tick*2 + f.ph)*14, f.y, f.s);
  }
  for (let i = sparks.length - 1; i >= 0; i--){
    const p = sparks[i];
    p.x += p.vx; p.y += p.vy; p.vy += .05; p.vx *= .985; p.life -= p.decay;
    if (p.life <= 0){ sparks.splice(i, 1); continue; }
    cx.globalAlpha = p.life; cx.fillStyle = p.c;
    if (p.heart) heart(p.x, p.y, p.r*1.6);
    else { cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.283); cx.fill(); }
  }
  cx.globalAlpha = 1;
  requestAnimationFrame(frame);
})();

$("reshuffle").onclick = shuffle;
$("next").onclick = () => { $("reveal").classList.add("show"); $("reveal").scrollIntoView({behavior:"smooth"}); };

// If the photo is missing, show numbers so you can still test the puzzle
const probe = new Image();
probe.onerror = () => board.querySelectorAll(".tile").forEach(t=>{t.style.backgroundImage="none";t.textContent=+t.dataset.id+1;});
probe.src = CONFIG.photo;
shuffle();
</script>
</body>
</html>
